name: 2. Empaquetar y Firmar APK (Español)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio (assets modificados)
        uses: actions/checkout@v4

      - name: Configurar Java y Python
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Preparar Herramientas (Apktool y Uber Apk Signer)
        run: |
          wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar

      - name: Descargar APK base desde Google Drive
        run: |
          pip install gdown
          gdown "10BB1sV437S7weL_GAAuYtSLOWOiHma-u" -O base.apk

      - name: Desempaquetar APK original
        run: java -jar apktool.jar d base.apk -o apk_desempaquetado

      - name: Inyectar y Compilar textos en español
        run: |
          # 1. Descomprimir tus traducciones sobre la carpeta del juego
          unzip -o assets_modificados.zip -d apk_desempaquetado/
          
          # 2. Descargar el motor Ren'Py oficial (versión 8.3)
          wget https://www.renpy.org/dl/8.3.0/renpy-8.3.0-sdk.tar.bz2
          tar -xf renpy-8.3.0-sdk.tar.bz2
          
          # 3. Crear un "proyecto falso" (sandbox) para compilar SOLO la traducción
          echo "Creando sandbox de compilación..."
          mkdir -p proyecto_falso/game/x-tl
          cp -r apk_desempaquetado/assets/x-game/x-tl/x-english proyecto_falso/game/x-tl/
          
          # 4. Crear un parche para FORZAR al juego a cargar el idioma inglés (tu español)
          echo "init 999 python:" > proyecto_falso/game/forzar_idioma.rpy
          echo "    _preferences.language = 'english'" >> proyecto_falso/game/forzar_idioma.rpy
          
          # 5. Compilar el proyecto falso (genera los .rpyc sin tocar el juego original)
          echo "Compilando scripts aislados..."
          ./renpy-8.3.0-sdk/renpy.sh proyecto_falso compile
          
          # 6. Borrar los .rpyc antiguos del APK e inyectar los nuevos compilados limpios
          echo "Reintegrando archivos al APK..."
          find apk_desempaquetado/assets/x-game/x-tl/x-english/ -type f -name "*.rpyc" -delete || true
          cp -r proyecto_falso/game/x-tl/x-english/* apk_desempaquetado/assets/x-game/x-tl/x-english/
          
          # 7. Añadir el parche de idioma a la raíz del juego
          cp proyecto_falso/game/forzar_idioma.rpyc apk_desempaquetado/assets/x-game/ || true



      - name: Reconstruir APK
        run: java -jar apktool.jar b apk_desempaquetado -o totono_espanol_sin_firma.apk

      - name: Firmar APK para Android
        run: java -jar signer.jar -a totono_espanol_sin_firma.apk --out apk_final

      - name: Guardar APK Jugable
        uses: actions/upload-artifact@v4
        with:
          name: Totono-Espanol-Android
          path: apk_final/*.apk
