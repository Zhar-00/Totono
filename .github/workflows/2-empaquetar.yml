name: 2. Empaquetar y Firmar APK (Español)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio (assets modificados)
        uses: actions/checkout@v4

      - name: Configurar Java y Python
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Preparar Herramientas (Apktool y Uber Apk Signer)
        run: |
          wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar

      - name: Descargar APK base desde Google Drive
        run: |
          pip install gdown
          gdown "10BB1sV437S7weL_GAAuYtSLOWOiHma-u" -O base.apk

      - name: Desempaquetar APK original
        run: java -jar apktool.jar d base.apk -o apk_desempaquetado

      - name: Inyectar textos en español
        run: |
          # 1. Descomprimir tus traducciones sobre la carpeta del juego
          unzip -o assets_modificados.zip -d apk_desempaquetado/
          
          # 2. Borrar los .rpyc de inglés obsoletos
          echo "Borrando compilaciones antiguas..."
          find apk_desempaquetado/assets/x-game/x-tl/x-english/x-script/ -type f -name "*.rpyc" -delete || true

      - name: Compilar traducciones a .rpyc
        run: |
          # 3. Descargar el motor Ren'Py oficial (versión 8.3 para Python 3)
          wget https://www.renpy.org/dl/8.3.0/renpy-8.3.0-sdk.tar.bz2
          tar -xf renpy-8.3.0-sdk.tar.bz2
          
          # 4. Renombrar temporalmente la carpeta x-game a game para que el motor la reconozca
          mv apk_desempaquetado/assets/x-game apk_desempaquetado/assets/game
          
          # 5. Forzar la compilación de todos los scripts (esto creará tus nuevos .rpyc en español)
          echo "Compilando scripts a bytecode..."
          ./renpy-8.3.0-sdk/renpy.sh apk_desempaquetado/assets compile
          
          # 6. Devolverle su nombre modificado para que el port de Android funcione
          mv apk_desempaquetado/assets/game apk_desempaquetado/assets/x-game


      - name: Reconstruir APK
        run: java -jar apktool.jar b apk_desempaquetado -o totono_espanol_sin_firma.apk

      - name: Firmar APK para Android
        run: java -jar signer.jar -a totono_espanol_sin_firma.apk --out apk_final

      - name: Guardar APK Jugable
        uses: actions/upload-artifact@v4
        with:
          name: Totono-Espanol-Android
          path: apk_final/*.apk
