name: 1. Extraer Scripts de Ren'Py

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java y Python
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Apktool, Unrpyc y Rpatool
        run: |
          wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          git clone https://github.com/CensoredUsername/unrpyc.git
          wget https://raw.githubusercontent.com/Shizmob/rpatool/master/rpatool -O rpatool

      - name: Descargar APK masivo desde Google Drive
        run: |
          pip install gdown
          gdown "10BB1sV437S7weL_GAAuYtSLOWOiHma-u" -O totono_ingles.apk

      - name: Desempaquetar APK
        run: java -jar apktool.jar d totono_ingles.apk -o apk_desempaquetado

      - name: Extraer archivos RPA y descompilar RPYC
        run: |
          # 1. Buscar la carpeta principal del juego (usualmente assets/x-game o assets/game)
          GAME_DIR=$(find apk_desempaquetado -type d -name "x-game" | head -n 1)
          if [ -z "$GAME_DIR" ]; then
            GAME_DIR=$(find apk_desempaquetado -type d -name "game" | head -n 1)
          fi
          echo "Directorio del juego detectado en: $GAME_DIR"
          cd "$GAME_DIR"
          
          # 2. Romper las bóvedas .rpa
          echo "Extrayendo archivos .rpa..."
          find . -maxdepth 1 -name "*.rpa" -exec python $GITHUB_WORKSPACE/rpatool -x {} -o ./ \;
          
          # 3. Descompilar todos los .rpyc resultantes a .rpy
          echo "Descompilando scripts..."
          find . -name "*.rpyc" -exec python $GITHUB_WORKSPACE/unrpyc/unrpyc.py {} +
          
      - name: Guardar Scripts Originales (.rpy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Totono-Scripts-Ingles
          # Guardamos solo los .rpy para que el ZIP no pese gigabytes
          path: apk_desempaquetado/**/*.rpy
